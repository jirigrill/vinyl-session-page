<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vinyl Sessions</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    h1 { font-size: 1.2rem; margin: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; padding: 0 1rem 1rem; }
    .card { color: inherit; text-decoration: none; }
    .thumb { position: relative; }
    .thumb img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-radius: 6px; }
    .dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8); padding: 1px 5px; border-radius: 3px; font-size: .8rem; }
    .title { margin: .4rem 0 .1rem; font-size: .95rem; }
    .channel { margin: 0; color: #aaa; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Vinyl Sessions ({{len .}})</h1>
  <div class="grid">
    {{range .}}
    <a class="card" href="/watch/{{.ID}}">
      <div class="thumb"><img src="{{.ThumbnailURL}}" alt="" loading="lazy"><span class="dur">{{duration .Duration}}</span></div>
      <p class="title">{{.Title}}</p>
      <p class="channel">{{.ChannelTitle}}</p>
    </a>
    {{else}}
    <p>No sessions yet. Run <code>vinyl ingest</code>.</p>
    {{end}}
  </div>
</body>
</html>
