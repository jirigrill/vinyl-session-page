<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Vinyl Sessions</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    .player { position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 1280px; margin: 0 auto; }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    p { text-align: center; }
    a { color: #9cf; }
    h1 { font-size: 1.1rem; text-align: center; margin: 1rem; }
  </style>
</head>
<body>
  <div class="player">
    <iframe src="https://www.youtube.com/embed/{{.ID}}"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen></iframe>
  </div>
  <h1>{{.Title}}</h1>
  <p>{{.ChannelTitle}} · {{duration .Duration}}</p>
  <p><a href="/">All sessions</a> · <a href="https://www.youtube.com/watch?v={{.ID}}" target="_blank" rel="noopener">Open on YouTube</a></p>
</body>
</html>
